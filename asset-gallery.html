<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prepared asset library · If Only You Knew...</title>
<style>body{margin:30px auto;max-width:1200px;padding:0 20px;background:#fffaf6;color:#55453d;font:15px/1.6 system-ui}h1{font:36px 'Segoe Print',cursive}a{color:#a85e77}section{padding:24px 0;border-bottom:1px solid #e3d2ca}.frames{display:flex;flex-wrap:wrap;gap:10px}figure{margin:0;width:150px;background:#e8ebdf;border-radius:8px;padding:8px;box-sizing:border-box}img{width:134px;height:140px;object-fit:contain}figcaption{text-align:center;font-size:11px;color:#6d6a61}h2{font-size:18px}header{position:sticky;top:0;background:#fffaf6f5;padding:10px 0;z-index:1}select{padding:10px;font:inherit;border:1px solid #d3b9b6;border-radius:8px;max-width:100%}</style>
<h1>The little art library</h1><p>Every extracted frame, shown on a contrasting background so cropping and transparency can be inspected. Original sources and crop coordinates are recorded in <a href="asset-map.json">the asset map</a>.</p><header><a href="index.html">Play the game</a> · <label>Jump to <select id="jump"><option value="">Choose an asset set</option></select></label></header><main id="library"></main><script src="assets/manifest.js"></script><script>
const library=document.querySelector('#library'),jump=document.querySelector('#jump');
for(const [name,frames] of Object.entries(ASSETS)){const option=document.createElement('option');option.value=name;option.textContent=name;jump.append(option);const section=document.createElement('section');section.id=name;const h=document.createElement('h2');h.textContent=name+' · '+frames.length+' frames';section.append(h);const strip=document.createElement('div');strip.className='frames';frames.forEach((src,i)=>{const f=document.createElement('figure'),im=document.createElement('img'),caption=document.createElement('figcaption');im.src=src;im.loading='lazy';im.alt=name+', frame '+(i+1);caption.textContent='Frame '+(i+1);f.append(im,caption);strip.append(f)});section.append(strip);library.append(section)}jump.onchange=()=>{if(jump.value)document.getElementById(jump.value).scrollIntoView({block:'start'})};
</script></html>
